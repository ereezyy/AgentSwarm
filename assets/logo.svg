<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#0a1a2e"/>
    </linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg2)"/>
  
  <!-- Whale silhouette -->
  <g transform="translate(200,200)" fill="#00E5FF" opacity="0.8" filter="url(#glow2)">
    <ellipse cx="0" cy="0" rx="100" ry="45"/>
    <ellipse cx="-80" cy="-15" rx="40" ry="25"/>
    <circle cx="-30" cy="10" r="8" fill="#0a0a2e"/>
    <path d="M100,0 Q140,-30 160,0 Q140,-10 100,0" fill="#00E5FF"/>
  </g>
  
  <!-- Data nodes -->
  <g fill="#CCFF00" opacity="0.6">
    <circle cx="60" cy="100" r="4"/>
    <circle cx="120" cy="80" r="3"/>
    <circle cx="280" cy="120" r="5"/>
    <circle cx="340" cy="90" r="3"/>
    <circle cx="80" cy="300" r="4"/>
    <circle cx="320" cy="280" r="4"/>
  </g>
  
  <!-- Lines connecting nodes -->
  <g stroke="#FF0080" stroke-width="0.8" opacity="0.3">
    <line x1="60" y1="100" x2="200" y2="200"/>
    <line x1="120" y1="80" x2="200" y2="200"/>
    <line x1="280" y1="120" x2="200" y2="200"/>
    <line x1="340" y1="90" x2="200" y2="200"/>
  </g>
  
  <text x="200" y="340" text-anchor="middle" font-family="Impact, sans-serif" font-size="32" fill="#00E5FF" filter="url(#glow2)">AGENT SWARM</text>
  <text x="200" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#CCFF00">SOLANA WHALE TRACKER</text>
</svg>
